        function getError(event) {
            console.log("Erro capturado:", {
                message: event.message,
                filename: event.filename,
                lineno: event.lineno,
                colno: event.colno,
                error: event.error
            });
        }
        
        function getPromiseError(event) {
            console.log("Promise error capturado:", {
                reason: event.reason,
                promise: event.promise
            });
        }
